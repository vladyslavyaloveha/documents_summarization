[project]
name = "documents-summarization"
version = "0.1.0"
description = "Async PDF parsing and summarization"
authors = [{ name = "Vladyslav Yaloveha" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "langchain-text-splitters>=1.1.3",
    "pydantic>=2.14.2",
    "pydantic-ai-slim[google]>=2.64.0",
    "pydantic-settings>=2.16.2",
    "pypdf[crypto]>=6.21.4",
    "python-multipart>=0.0.33",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "docparser"

[tool.mypy]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-m", "not integration and not live and not slow"]
markers = [
    "integration: needs the docker compose Redis on localhost:6379",
    "live: calls the real Gemini API (needs GEMINI_API_KEY in .env)",
    "slow: real-world documents that take minutes to parse",
]

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]
